# Render Infrastructure Blueprint for Antigravity Autonomous AI Job Agent
services:
  - type: web
    name: antigravity-ai-job-agent
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m playwright install --with-deps chromium || true"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: AGENT_MODE
        value: DISCOVERY_MODE
      - key: CANDIDATE_NAME
        value: "Kiran A N"
      - key: CANDIDATE_PHONE
        value: "6361473807"
      - key: CANDIDATE_EMAIL
        value: "kiranan2004@gmail.com"
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: HEADLESS_BROWSER
        value: "true"
